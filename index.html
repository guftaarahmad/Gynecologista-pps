<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gynecology Apps</title>
<style>
  :root { --brand: #be185d; --bg: #fdf2f6; --text: #1f1720; --muted: #6b5a66; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { background: var(--brand); color: #fff; padding: 20px 16px; }
  h1 { margin: 0; font-size: 22px; } header p { margin: 4px 0 0; opacity: .85; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  a.app { display: flex; gap: 14px; align-items: center; background: #fff; border-radius: 14px; padding: 14px; text-decoration: none; color: inherit; box-shadow: 0 2px 10px rgba(80,20,50,.08); }
  a.app img { width: 56px; height: 56px; border-radius: 12px; }
  a.app b { display: block; font-size: 17px; } a.app span { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<header><h1>Gynecology Apps</h1><p>Prof. Dr. Sajida Guftaar</p></header>
<main>
  <a class="app" href="edd-planner/">
    <img src="edd-planner/icons/icon-192.png" alt="">
    <div><b>EDD Planner</b><span>Expected delivery dates – daily, weekly and monthly view</span></div>
  </a>
</main>
</body>
</html>
